name: data
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy
      - run: uv run atlas data verify
      - run: uv run pytest -m "not live"
